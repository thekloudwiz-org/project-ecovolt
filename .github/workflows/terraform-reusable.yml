name: Terraform Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        type: string
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.14.0'
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-central-1'
      working_directory:
        description: 'Working directory for Terraform files'
        required: false
        type: string
        default: 'infra'
      run_apply:
        description: 'Whether to run terraform apply'
        required: false
        type: boolean
        default: false
    secrets:
      aws_role_arn:
        description: 'AWS IAM Role ARN for OIDC'
        required: true

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required to checkout code
  pull-requests: write  # Required to comment on PRs
  security-events: write  # Required for security scanning

jobs:
  terraform-init:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: GitHubActions-${{ inputs.environment }}

      - name: Generate cache key
        id: cache-key
        run: echo "key=terraform-${{ inputs.environment }}-${{ hashFiles('**/*.tf', '.terraform.lock.hcl') }}" >> $GITHUB_OUTPUT

      - name: Cache Terraform Providers
        uses: actions/cache@v3
        with:
          path: |
            .terraform/providers
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            terraform-${{ inputs.environment }}-

      - name: Terraform Init
        run: |
          cd ${{ inputs.working_directory }}
          terraform init \
            -backend-config="key=project-ecovolt/${{ inputs.environment }}-tf.state"

  terraform-validate:
    name: Validate & Format
    runs-on: ubuntu-latest
    needs: terraform-init
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Restore Terraform Cache
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            .terraform/providers
          key: ${{ needs.terraform-init.outputs.cache-key }}

      - name: Terraform Init
        run: |
          cd ${{ inputs.working_directory }}
          terraform init -backend=false

      - name: Terraform Format Check
        id: fmt
        run: |
          cd ${{ inputs.working_directory }}
          terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: |
          cd ${{ inputs.working_directory }}
          terraform validate

      - name: Comment Format Results on PR
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` locally and commit the changes.'
            })

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ inputs.working_directory }}
          soft_fail: true
          format: sarif
          additional_args: --minimum-severity MEDIUM --out tfsec-results.sarif
        continue-on-error: true

      - name: Upload tfsec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: tfsec-results.sarif
        continue-on-error: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ inputs.working_directory }}
          framework: terraform
          soft_fail: true
          output_format: cli

  terraform-plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [terraform-init, security-scan]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: GitHubActions-${{ inputs.environment }}-plan

      - name: Restore Terraform Providers Cache
        uses: actions/cache@v3
        with:
          path: |
            .terraform/providers
          key: ${{ needs.terraform-init.outputs.cache-key }}

      - name: Terraform Init
        run: |
          cd ${{ inputs.working_directory }}
          terraform init \
            -backend-config="key=project-ecovolt/${{ inputs.environment }}-tf.state"

      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ inputs.working_directory }}
          terraform plan \
            -var-file=environments/${{ inputs.environment }}.tfvars \
            -out=${{ inputs.environment }}.tfplan \
            -no-color | tee plan-output.txt
        continue-on-error: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: |
            ${{ inputs.working_directory }}/${{ inputs.environment }}.tfplan
            ${{ inputs.working_directory }}/plan-output.txt
          retention-days: 5

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working_directory }}/plan-output.txt', 'utf8');
            const truncatedPlan = plan.length > 65000 ? plan.substring(0, 65000) + '\n\n... (truncated)' : plan;
            
            const output = `#### Terraform Plan for \`${{ inputs.environment }}\` 📖
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: inputs.run_apply == true
    environment:
      name: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: GitHubActions-${{ inputs.environment }}-apply

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}

      - name: Terraform Init
        run: |
          cd ${{ inputs.working_directory }}
          terraform init \
            -backend-config="key=project-ecovolt/${{ inputs.environment }}-tf.state" \
            -reconfigure

      - name: Verify Plan is Still Valid
        id: verify
        run: |
          cd ${{ inputs.working_directory }}
          # Check if the plan file is compatible with current state
          terraform show ${{ inputs.environment }}.tfplan > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::Plan file is no longer valid. State may have changed since plan was created."
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "valid=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Terraform Apply
        if: steps.verify.outputs.valid == 'true'
        run: |
          cd ${{ inputs.working_directory }}
          terraform apply -auto-approve ${{ inputs.environment }}.tfplan
      
      - name: Terraform Output
        id: terraform-output
        run: |
          cd ${{ inputs.working_directory }}
          terraform output -json > outputs.json

      - name: Comment on Invalid Plan
        if: steps.verify.outputs.valid == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Terraform Apply Failed**\n\nThe plan file is no longer valid. The state may have been modified since the plan was created.\n\nPlease re-run the workflow to create a fresh plan.'
            })

      - name: Terraform Output
        id: output-json
        run: terraform output -json > outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/outputs.json
          retention-days: 30

      - name: Comment Apply Success on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Terraform Apply Successful** for `${{ inputs.environment }}`\n\nInfrastructure has been updated.'
            })

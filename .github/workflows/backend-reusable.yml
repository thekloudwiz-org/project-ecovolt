name: Backend Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-central-1'
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.11'
    secrets:
      aws_role_arn:
        description: 'AWS IAM Role ARN for OIDC'
        required: true
      deployment_bucket:
        description: 'S3 bucket name for Lambda deployment packages'
        required: true
      api_handler_lambda:
        description: 'API Handler Lambda function name'
        required: false
      iot_processor_lambda:
        description: 'IoT Processor Lambda function name'
        required: false

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required to checkout code

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('application/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          cd application/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov hypothesis
      
      - name: Run syntax validation
        run: |
          cd application/backend
          python -m py_compile api/*.py models/*.py utils/*.py
      
      - name: Run unit tests
        run: |
          cd application/backend
          # pytest tests/ --cov=. --cov-report=xml --cov-report=term
          echo "Unit tests would run here"
      
      - name: Run property-based tests
        run: |
          cd application/backend
          # pytest tests/properties/ --hypothesis-show-statistics
          echo "Property-based tests would run here"
      
      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./application/backend/coverage.xml
          flags: backend
          name: backend-coverage

  build:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}
      
      - name: Create deployment package
        run: |
          cd application/backend
          
          # Create package directory
          mkdir -p package
          
          # Install dependencies
          pip install -r requirements.txt -t package/
          
          # Copy source code
          cp -r api models utils package/
          
          # Create zip file
          cd package
          zip -r ../lambda-deployment.zip .
          cd ..
          
          # Add function handlers
          zip -g lambda-deployment.zip functions/*.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package-${{ github.sha }}
          path: application/backend/lambda-deployment.zip
          retention-days: 30

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: GitHubActions-Backend-${{ inputs.environment }}
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package-${{ github.sha }}
          path: ./
      
      - name: Upload to S3
        run: |
          aws s3 cp lambda-deployment.zip \
            s3://${{ secrets.deployment_bucket }}/backend/${{ inputs.environment }}/lambda-${{ github.sha }}.zip
      
      - name: Update Lambda functions
        run: |
          set +e  # Don't exit on error, we'll handle errors ourselves
          
          echo "🚀 Updating Lambda functions..."
          echo ""
          
          # Define backend Lambda functions to update
          # Note: stream_processor and data_transformer are in the analytics module
          # and have their own deployment process
          declare -A FUNCTIONS
          FUNCTIONS["API Handler"]="${{ secrets.api_handler_lambda }}"
          FUNCTIONS["IoT Processor"]="${{ secrets.iot_processor_lambda }}"
          
          UPDATED=0
          SKIPPED=0
          FAILED=0
          
          for FUNC_LABEL in "${!FUNCTIONS[@]}"; do
            FUNCTION_NAME="${FUNCTIONS[$FUNC_LABEL]}"
            
            if [ -z "$FUNCTION_NAME" ]; then
              echo "⏭️  $FUNC_LABEL: No function name configured, skipping"
              ((SKIPPED++))
              continue
            fi
            
            echo ""
            echo "📦 Updating $FUNC_LABEL: $FUNCTION_NAME"
            
            if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null >/dev/null; then
              if aws lambda update-function-code \
                --function-name "$FUNCTION_NAME" \
                --s3-bucket ${{ secrets.deployment_bucket }} \
                --s3-key backend/${{ inputs.environment }}/lambda-${{ github.sha }}.zip \
                --no-cli-pager >/dev/null; then
                
                if aws lambda wait function-updated --function-name "$FUNCTION_NAME" 2>/dev/null; then
                  echo "✅ $FUNC_LABEL updated successfully"
                  ((UPDATED++))
                else
                  echo "⚠️  $FUNC_LABEL update timed out or failed"
                  ((FAILED++))
                fi
              else
                echo "❌ $FUNC_LABEL update failed"
                ((FAILED++))
              fi
            else
              echo "⏭️  $FUNC_LABEL function not found: $FUNCTION_NAME"
              ((SKIPPED++))
            fi
          done
          
          echo ""
          echo "========================================="
          echo "📊 Deployment Summary"
          echo "========================================="
          echo "✅ Updated: $UPDATED function(s)"
          echo "⏭️  Skipped: $SKIPPED function(s)"
          echo "❌ Failed: $FAILED function(s)"
          echo ""
          echo "💡 Deployment package location:"
          echo "   s3://${{ secrets.deployment_bucket }}/backend/${{ inputs.environment }}/lambda-${{ github.sha }}.zip"
          
          if [ $SKIPPED -gt 0 ]; then
            echo ""
            echo "🔧 To configure Lambda functions, add these GitHub secrets:"
            echo "   - api_handler_dev_lambda"
            echo "   - iot_processor_dev_lambda"
          fi
          
          # Exit with success if at least one function was updated
          if [ $UPDATED -gt 0 ]; then
            echo ""
            echo "✅ Deployment successful! At least one function was updated."
            exit 0
          elif [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Deployment failed! No functions were updated successfully."
            exit 1
          else
            echo ""
            echo "⚠️  No functions were updated. Please configure Lambda function secrets."
            exit 0
          fi
      
      - name: Run database migrations
        run: |
          echo "🗄️  Running database migrations..."
          
          # Install PostgreSQL client
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
          
          # Get the secret ARN from SSM Parameter Store
          SECRET_ARN=$(aws ssm get-parameter \
            --name "/ecovolt/${{ inputs.environment }}/database/secret-arn" \
            --query Parameter.Value \
            --output text)
          
          echo "📋 Using secret: $SECRET_ARN"
          
          # Get database credentials from Secrets Manager using the ARN
          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query SecretString \
            --output text)
          
          DB_HOST=$(echo $DB_SECRET | jq -r '.host')
          DB_PORT=$(echo $DB_SECRET | jq -r '.port')
          DB_NAME=$(echo $DB_SECRET | jq -r '.dbname')
          DB_USER=$(echo $DB_SECRET | jq -r '.username')
          DB_PASSWORD=$(echo $DB_SECRET | jq -r '.password')
          
          # Set PostgreSQL password environment variable
          export PGPASSWORD="$DB_PASSWORD"
          
          echo "📊 Database: $DB_NAME on $DB_HOST:$DB_PORT"
          
          # Create migrations tracking table if it doesn't exist
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" << 'EOF'
          CREATE TABLE IF NOT EXISTS schema_migrations (
            migration_id VARCHAR(50) PRIMARY KEY,
            applied_at TIMESTAMP DEFAULT NOW()
          );
          EOF
          
          # Run migrations in order
          for migration_file in application/backend/migrations/*.sql; do
            migration_name=$(basename "$migration_file" .sql)
            
            # Check if migration has already been applied
            already_applied=$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -t -c \
              "SELECT COUNT(*) FROM schema_migrations WHERE migration_id = '$migration_name';")
            
            if [ "$already_applied" -gt 0 ]; then
              echo "⏭️  Skipping $migration_name (already applied)"
            else
              echo "📝 Applying $migration_name..."
              
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -f "$migration_file"; then
                # Record successful migration
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c \
                  "INSERT INTO schema_migrations (migration_id) VALUES ('$migration_name');"
                echo "✅ $migration_name applied successfully"
              else
                echo "❌ Failed to apply $migration_name"
                exit 1
              fi
            fi
          done
          
          echo ""
          echo "✅ All database migrations completed successfully"
          
          # Unset password
          unset PGPASSWORD
      
      - name: Verify deployment
        run: |
          echo "Deployment to ${{ inputs.environment }} completed successfully"

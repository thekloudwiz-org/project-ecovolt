name: Terraform Production Environment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**/*.tf'
      - 'infra/**/*.tfvars'
      - '.github/workflows/prod.yml'
      - '.github/workflows/terraform-reusable.yml'
      - '!**/*.md'
  push:
    branches:
      - main
    paths:
      - 'infra/**/*.tf'
      - 'infra/**/*.tfvars'
      - '.github/workflows/prod.yml'
      - '.github/workflows/terraform-reusable.yml'
      - '!**/*.md'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  terraform-prod:
    name: Terraform Production
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: prod
      terraform_version: '1.5'
      aws_region: 'eu-central-1'
      working_directory: 'infra'
      # Apply only on merge (push), not on PR
      run_apply: ${{ github.event_name == 'push' }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_PROD }}

name: Terraform Staging Environment

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'infra/**'
      - 'infra/**'
      - 'modules/**'
      - 'environments/**'
      - '.github/workflows/staging.yml'
      - '.github/workflows/terraform-reusable.yml'
  push:
    branches:
      - staging
    paths:
      - 'infra/**'
      - 'infra/**'
      - 'modules/**'
      - 'environments/**'
      - '.github/workflows/staging.yml'
      - '.github/workflows/terraform-reusable.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  terraform-staging:
    name: Terraform Staging
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: staging
      terraform_version: '1.5'
      aws_region: 'eu-central-1'
      working_directory: 'infra'
      # Apply only on merge (push), not on PR
      run_apply: ${{ github.event_name == 'push' }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_STAGING }}
